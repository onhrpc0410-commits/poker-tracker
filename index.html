<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Poker Tracker</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>
<div id="rotate">Rotate your device</div>
<div id="warn" hidden>Storage unavailable: data will not be saved.</div>
<div id="app">
  <section id="screen-players" hidden></section>
  <section id="screen-setup" hidden></section>
  <section id="screen-game" hidden></section>
  <section id="screen-summary" hidden></section>
</div>
<script src="js/store.js"></script>
<script src="js/engine.js"></script>
<script src="js/ui-players.js"></script>
<script src="js/ui-setup.js"></script>
<script src="js/ui-game.js"></script>
<script src="js/ui-summary.js"></script>
<script src="js/app.js"></script>
<script>
if ("serviceWorker" in navigator) {
  var hadController = !!navigator.serviceWorker.controller, reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", function () {
    if (hadController && !reloaded) { reloaded = true; location.reload(); }
  });
  navigator.serviceWorker.register("sw.js").then(function (r) { r.update(); }).catch(function () {});
}
</script>
</body>
</html>
